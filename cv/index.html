<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CV — Mochammad Maulana Ibrahim</title>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --accent: #00D4FF;
            --accent-dim: rgba(0, 212, 255, 0.12);
            --accent-border: rgba(0, 212, 255, 0.2);
            --dark: #080D1A;
            --dark-card: rgba(13, 21, 40, 0.9);
            --white: #FFFFFF;
            --white-60: rgba(255,255,255,0.6);
            --white-25: rgba(255,255,255,0.22);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(0,80,180,0.18) 0%, transparent 68%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -150px; right: -100px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,212,255,0.07) 0%, transparent 68%);
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--dark-card);
            border: 1px solid var(--accent-border);
            border-radius: 20px;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 1;
            box-shadow: 0 0 60px rgba(0,212,255,0.06);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 1px;
        }

        .avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0050B8, #00D4FF);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
            overflow: hidden;
        }
        .avatar img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center top;
        }

        .header { text-align: center; }
        .header h1 {
            font-size: 18px; font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header .accent {
            color: var(--accent);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .divider {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.15), transparent);
        }

        .info-box {
            background: rgba(0,212,255,0.04);
            border: 1px solid rgba(0,212,255,0.1);
            border-radius: 12px;
            padding: 14px 16px;
            width: 100%;
            font-size: 12px;
            color: var(--white-60);
            line-height: 1.7;
            text-align: center;
        }
        .info-box strong { color: var(--accent); font-weight: 500; }

        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.22s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,212,255,0.15);
        }
        .btn-google:active { transform: translateY(0); }
        .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
        .btn-google.loading { opacity: 0.7; cursor: not-allowed; transform: none; }

        .error-msg {
            display: none;
            width: 100%;
            background: rgba(255,80,80,0.08);
            border: 1px solid rgba(255,80,80,0.2);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 12px;
            color: #ff8080;
            text-align: center;
        }

        .footer-note {
            font-size: 11px;
            color: var(--white-25);
            text-align: center;
            line-height: 1.7;
        }

        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .p {
            position: absolute; border-radius: 50%;
            background: #00D4FF; opacity: 0;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { opacity: 0; transform: translateY(0) scale(0); }
            8%   { opacity: 0.4; transform: translateY(-18px) scale(1); }
            92%  { opacity: 0.08; }
            100% { opacity: 0; transform: translateY(-260px) scale(0.4); }
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
<div class="particles" id="pts"></div>
<div class="card">
<div class="avatar">
<img alt="MMI" onerror="this.style.display='none'; this.parentElement.innerHTML='MMI';" src="../FotoProfil.jpeg?expires=1790345810&amp;signature=559ab7191f1e6fd70dc314e0b0be4b5a7fce53faa0d0c30d400cac39726df431&amp;kid=prod-250922"/>
</div>
<div class="header">
<span class="accent">Curriculum Vitae</span>
<h1>Mochammad Maulana Ibrahim</h1>
</div>
<div class="divider"></div>
<div class="info-box">
        This CV is <strong>access-controlled.</strong><br/>
        Sign in with your Google account to continue.<br/>
        Your identity will be recorded for security purposes.
    </div>
<div class="error-msg" id="errorMsg"></div>
<button class="btn-google" id="btnGoogle" onclick="signInWithGoogle()">
<svg viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
        Continue with Google
    </button>
<div class="footer-note">
        By signing in, you agree that your name and email<br/>
        will be recorded for access tracking purposes.
    </div>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBv4VrPdi1E7CByp79T6Ios4MGYpYRm9Uc",
        authDomain: "personal-website-mmi.firebaseapp.com",
        projectId: "personal-website-mmi",
        storageBucket: "personal-website-mmi.firebasestorage.app",
        messagingSenderId: "57812235771",
        appId: "1:57812235771:web:5cd823cee44e095fc1475e"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Do NOT auto-redirect on existing session.
    // User MUST explicitly click "Continue with Google" every time.
    // This ensures every visit is recorded in Firestore.
    // We only check auth state to show loading state briefly.
    onAuthStateChanged(auth, (user) => {
        // If user has active session, sign them out first
        // so they must explicitly confirm each visit
        if (user) {
            import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js")
                .then(({ signOut }) => signOut(auth))
                .catch(() => {});
        }
    });

    window.signInWithGoogle = async function() {
        const btn = document.getElementById('btnGoogle');
        const err = document.getElementById('errorMsg');
        btn.classList.add('loading');
        btn.textContent = 'Signing in...';
        err.style.display = 'none';

        try {
            const result = await signInWithPopup(auth, provider);
            const user   = result.user;

            await addDoc(collection(db, "visitors"), {
                name:      user.displayName,
                email:     user.email,
                photo:     user.photoURL,
                uid:       user.uid,
                timestamp: serverTimestamp(),
                userAgent: navigator.userAgent,
                referrer:  document.referrer || "direct"
            });

            window.location.href = "cv.html";

        } catch (error) {
            console.error(error);
            err.textContent = "Sign-in failed. Please try again.";
            err.style.display = 'block';
            btn.classList.remove('loading');
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google`;
        }
    };
</script>
<script>
    const c = document.getElementById('pts');
    for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'p';
        const s = 1 + Math.random() * 2;
        p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}vw;bottom:0;animation-duration:${9+Math.random()*11}s;animation-delay:${Math.random()*10}s`;
        c.appendChild(p);
    }
</script>
</body>
</html>
