        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #050810;
            color: #fff;

        /* ── TOP BAR ── */
        .topbar {

            border-bottom: 1px solid rgba(0,212,255,0.12);
            display: flex; align-items: center;

        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-avatar {

            overflow: hidden; flex-shrink: 0;

        .topbar-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .topbar-label { font-size: 10px; color: #00D4FF; }

        /* ── STAGE ── */
        .stage {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 25% 40%, rgba(0,60,160,0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 65%, rgba(0,212,255,0.07) 0%, transparent 50%),
                #050810;
            position: relative; overflow: hidden;
        }
        .stage::before {
            content: '';
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* ── BOOK ── */
        #book {
            position: relative;
            display: flex;
            filter: drop-shadow(0 40px 80px rgba(0,0,0,0.8));
        }

        /* ── PAGES ── */
        .book-page {
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Spine */
        #spine {
            width: 8px; flex-shrink: 0;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(0,212,255,0.15) 10%,
                rgba(0,212,255,0.35) 50%,
                rgba(0,212,255,0.15) 90%,
                transparent 100%);
            z-index: 20;
            align-self: stretch;
        }

        /* ── FLIP CONTAINER — sits on LEFT page, flips RIGHT ── */
        #flipContainer {
            position: absolute;
            top: 0; left: 0;
            transform-origin: right center;
            z-index: 10;
            cursor: grab;
        }
        #flipContainer.grabbing { cursor: grabbing; }

        /* Corner hint — bottom RIGHT of left page */
        .corner-hint {
            position: absolute;
            bottom: 0; right: 0;
            width: 44px; height: 44px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,212,255,0.18) 50%);
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s;
        }
        .corner-hint:hover {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,212,255,0.28) 50%);
        }

        /* ── COVER PAGE ── */
        .cover-page {
            width: 100%; height: 100%;
            background: linear-gradient(145deg, #0A1628 0%, #0D1F3C 45%, #080D1A 100%);

        .cover-page::before {

        .cover-grid {

        /* ── LOADING ── */

<script>
// ══════════════════════════════════════════════
//  PAGE FLIP ENGINE — Cover LEFT, Blank RIGHT
//  Flip goes LEFT → RIGHT (cover opens rightward)
// ══════════════════════════════════════════════

let PW, PH;
let isOpen      = false;
let isAnimating = false;
let isDragging  = false;
let dragStartX  = 0;
let currentProgress = 0; // 0 = closed, 1 = open

const coverImg = new Image();
const cvImg    = new Image();

let canvas, ctx;

function initBook() {
    const stage = document.getElementById('stage');
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;

    let pH = Math.min(sh * 0.88, 600);
    let pW = Math.min(pH / 1.414, (sw * 0.88) / 2);
    pH = pW * 1.414;
    PW = Math.floor(pW);
    PH = Math.floor(pH);

    // Size pages
    document.getElementById('leftPage').style.cssText  += `width:${PW}px;height:${PH}px;`;
    document.getElementById('rightPage').style.cssText += `width:${PW}px;height:${PH}px;`;
    document.getElementById('leftContent').style.cssText  = `width:${PW}px;height:${PH}px;position:absolute;top:0;left:0;`;
    document.getElementById('rightContent').style.cssText = `width:${PW}px;height:${PH}px;position:absolute;top:0;left:0;`;
    document.getElementById('spine').style.height = PH + 'px';

    // Canvas
    canvas = document.getElementById('flipCanvas');
    canvas.width  = PW;
    canvas.height = PH;
    canvas.style.width  = PW + 'px';
    canvas.style.height = PH + 'px';
    canvas.style.zIndex = '10';
    canvas.style.display = 'none';
    ctx = canvas.getContext('2d');

    // Preload images
    cvImg.src    = 'pages/page-1.jpg';
    coverImg.src = '../FotoProfil.jpeg';

    setupDrag();

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && !isOpen) flipToOpen();
        if (e.key === 'ArrowLeft'  && isOpen)  flipToClose();
    });

    window.addEventListener('resize', initBook);
}

// ── DRAG ──
function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }

function setupDrag() {
    const lp = document.getElementById('leftPage');
    lp.addEventListener('mousedown',  onDown);
    lp.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('mousemove',  onMove);
    window.addEventListener('touchmove',  onMove, { passive: true });
    window.addEventListener('mouseup',    onUp);
    window.addEventListener('touchend',   onUp);
}

function onDown(e) {
    if (isAnimating) return;
    isDragging = true;
    dragStartX = getX(e);
    canvas.style.cursor = 'grabbing';
}

function onMove(e) {
    if (!isDragging) return;
    const dx   = getX(e) - dragStartX;
    const lp   = document.getElementById('leftPage');
    const rect = lp.getBoundingClientRect();

    let prog;
    if (!isOpen) {
        // Drag right to open (cover flips right)
        prog = Math.max(0, Math.min(1, dx / PW));
    } else {
        // Drag left to close
        prog = Math.max(0, Math.min(1, 1 + dx / PW));
    }

    currentProgress = prog;
    renderFlip(prog);
}

function onUp() {
    if (!isDragging) return;
    isDragging = false;
    canvas.style.cursor = 'grab';

    if (!isOpen) {
        currentProgress > 0.4 ? animateTo(1, true) : animateTo(0, false);
    } else {
        currentProgress < 0.6 ? animateTo(0, false) : animateTo(1, true);
    }
}

// ── ANIMATE ──
function animateTo(target, openState) {
    if (isAnimating) return;
    isAnimating = true;
    const from     = currentProgress;
    const diff     = target - from;
    const duration = 650;
    const start    = performance.now();

    function step(now) {
        const t    = Math.min((now - start) / duration, 1);
        const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
        currentProgress = from + diff * ease;
        renderFlip(currentProgress);

        if (t < 1) {
            requestAnimationFrame(step);
        } else {
            isAnimating      = false;
            isOpen           = openState;
            currentProgress  = target;
            renderFlip(target);
            updatePageContent();
            updateUI();
        }
    }
    requestAnimationFrame(step);
}

// ── RENDER ──
function renderFlip(prog) {
    // prog: 0 = cover visible, 1 = fully flipped open

    if (prog <= 0) {
        canvas.style.display = 'none';
        showCover();
        return;
    }
    if (prog >= 1) {
        canvas.style.display = 'none';
        showCV();
        return;
    }

    canvas.style.display = 'block';
    ctx.clearRect(0, 0, PW, PH);

    // The fold moves from right edge (prog=0) to left edge (prog=1)
    const foldX = PW * (1 - prog);

    // ── LEFT PART: back of flipping page = CV image ──
    if (foldX > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, foldX, PH);
        ctx.clip();

        if (cvImg.complete && cvImg.naturalWidth > 0) {
            ctx.drawImage(cvImg, 0, 0, PW, PH);
        } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, PW, PH);
            ctx.fillStyle = '#aaa';
            ctx.font = '13px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Loading CV...', PW/2, PH/2);
        }

        // Shadow near fold
        const sw2 = Math.min(50, foldX);
        const sg  = ctx.createLinearGradient(foldX - sw2, 0, foldX, 0);
        sg.addColorStop(0, 'rgba(0,0,0,0)');
        sg.addColorStop(1, `rgba(0,0,0,${0.4 * prog})`);
        ctx.fillStyle = sg;
        ctx.fillRect(foldX - sw2, 0, sw2, PH);

        ctx.restore();
    }

    // ── RIGHT PART: front of flipping page = cover (compressed) ──
    if (foldX < PW) {
        const scaleX = Math.cos(prog * Math.PI);
        const absScale = Math.abs(scaleX);

        if (absScale > 0.01) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(foldX, 0, PW - foldX, PH);
            ctx.clip();

            ctx.translate(foldX, 0);
            ctx.scale(absScale, 1);
            drawCoverCanvas(0, 0, PW, PH);
            ctx.scale(1/absScale, 1);
            ctx.translate(-foldX, 0);

            // Fold shadow
            const fw  = Math.min(60, PW - foldX);
            const fg  = ctx.createLinearGradient(foldX, 0, foldX + fw, 0);
            fg.addColorStop(0, `rgba(0,0,0,${0.45 * (1 - absScale)})`);
            fg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = fg;
            ctx.fillRect(foldX, 0, fw, PH);

            ctx.restore();
        }
    }

    // Fold line
    ctx.beginPath();
    ctx.moveTo(foldX, 0);
    ctx.lineTo(foldX, PH);
    ctx.strokeStyle = `rgba(0,0,0,${0.25 * Math.sin(prog * Math.PI)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

function drawCoverCanvas(x, y, w, h) {
    // BG gradient
    const bg = ctx.createLinearGradient(x, y, x+w, y+h);
    bg.addColorStop(0,    '#0A1628');
    bg.addColorStop(0.45, '#0D1F3C');
    bg.addColorStop(1,    '#080D1A');
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, w, h);

    // Grid
    ctx.strokeStyle = 'rgba(0,212,255,0.05)';
    ctx.lineWidth = 1;
    for (let gx = x; gx < x+w; gx += 36) {
        ctx.beginPath(); ctx.moveTo(gx,y); ctx.lineTo(gx,y+h); ctx.stroke();
    }
    for (let gy = y; gy < y+h; gy += 36) {
        ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x+w,gy); ctx.stroke();
    }

    // Glow
    const gl = ctx.createRadialGradient(x+w*0.4, y+h*0.35, 0, x+w*0.4, y+h*0.35, w*0.6);
    gl.addColorStop(0, 'rgba(0,100,220,0.3)');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(x, y, w, h);

    // Photo
    const cx = x + w/2, cy = y + h*0.32, r = Math.min(w,h)*0.1;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.clip();
    if (coverImg.complete && coverImg.naturalWidth > 0) {
        ctx.drawImage(coverImg, cx-r, cy-r, r*2, r*2);
    } else {
        const pg = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
        pg.addColorStop(0,'#0050B8'); pg.addColorStop(1,'#00D4FF');
        ctx.fillStyle = pg;
        ctx.fillRect(cx-r, cy-r, r*2, r*2);
    }
    ctx.restore();

    // Name
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.floor(w*0.065)}px serif`;
    ctx.fillText('Mochammad', cx, cy + r + h*0.08);
    ctx.fillText('Maulana Ibrahim', cx, cy + r + h*0.145);

    // Line
    ctx.strokeStyle = 'rgba(0,212,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx-20, cy+r+h*0.175);
    ctx.lineTo(cx+20, cy+r+h*0.175);
    ctx.stroke();
}
