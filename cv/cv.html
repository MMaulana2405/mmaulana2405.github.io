<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0" name="viewport"/>
<title>CV — Mochammad Maulana Ibrahim</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#050810;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.topbar{height:50px;flex-shrink:0;background:rgba(8,13,26,.98);border-bottom:1px solid rgba(0,212,255,.12);display:flex;align-items:center;justify-content:space-between;padding:0 20px;backdrop-filter:blur(12px);z-index:100}
.tbl{display:flex;align-items:center;gap:10px}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0050B8,#00D4FF);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.av img{width:100%;height:100%;object-fit:cover}
.tn{font-size:13px;font-weight:600}
.tl{font-size:10px;color:#00D4FF}
.tbr{display:flex;align-items:center;gap:12px}
.bdl{display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);border-radius:20px;color:#00D4FF;font-size:11px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;text-decoration:none;transition:all .2s}
.bdl:hover{background:rgba(0,212,255,.18)}
.bso{font-size:11px;color:rgba(255,255,255,.25);background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif}
.bso:hover{color:#00D4FF}

.stage{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 25% 40%,rgba(0,60,160,.2) 0%,transparent 55%),radial-gradient(ellipse at 78% 65%,rgba(0,212,255,.07) 0%,transparent 50%),#050810;position:relative;overflow:hidden}
.stage::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}

/* Zoom wrapper */
#zoom-wrap{position:relative;z-index:1;transform-origin:center center;transition:transform .2s ease}
#flipbook-wrap{position:relative}

/* Override PageFlip */
.stf__block{perspective:4000px !important}
.stf__item{will-change:transform}

.bottombar{height:50px;flex-shrink:0;background:rgba(8,13,26,.98);border-top:1px solid rgba(0,212,255,.1);display:flex;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(12px)}
.nb{display:flex;align-items:center;justify-content:center;padding:7px 16px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:20px;color:#00D4FF;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;min-width:44px}
.nb:hover:not(:disabled){background:rgba(0,212,255,.16);transform:translateY(-1px)}
.nb:disabled{opacity:.25;cursor:not-allowed;transform:none}
.zoom-btn{font-size:16px;padding:7px 14px}

.ls{position:fixed;inset:0;background:#080D1A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200}
.sp{width:32px;height:32px;border:2px solid rgba(0,212,255,.15);border-top-color:#00D4FF;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{font-size:12px;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="ls" id="ls"><div class="sp"></div><div class="lt">Verifying access...</div></div>
<div class="topbar" id="tb" style="display:none">
<div class="tbl">
<div class="av"><img alt="" id="avi" onerror="this.style.display='none'" src=""/></div>
<div><div class="tn" id="tn">—</div><div class="tl">Viewing CV · Access Recorded</div></div>
</div>
<div class="tbr">
<a class="bdl" download="" href="../CV - Mochammad Maulana Ibrahim - 2026.pdf">⬇ Download PDF</a>
<button class="bso" onclick="doSO()">Sign out</button>
</div>
</div>
<div class="stage" id="st" style="display:none">
<div id="zoom-wrap">
<div id="flipbook-wrap">
<div id="flipbook"></div>
</div>
</div>
</div>
<div class="bottombar" id="bb" style="display:none">
<button class="nb" disabled="" id="bp" onclick="doPrev()">←</button>
<button class="nb zoom-btn" onclick="zoomOut()" title="Zoom out">−</button>
<button class="nb zoom-btn" onclick="zoomReset()" style="font-size:11px;padding:7px 10px" title="Reset zoom">100%</button>
<button class="nb zoom-btn" onclick="zoomIn()" title="Zoom in">+</button>
<button class="nb" id="bn" onclick="doNext()">→</button>
</div>
<script src="page-flip.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const auth=getAuth(initializeApp({
  apiKey:"AIzaSyBv4VrPdi1E7CByp79T6Ios4MGYpYRm9Uc",
  authDomain:"personal-website-mmi.firebaseapp.com",
  projectId:"personal-website-mmi",
  storageBucket:"personal-website-mmi.firebasestorage.app",
  messagingSenderId:"57812235771",
  appId:"1:57812235771:web:5cd823cee44e095fc1475e"
}));
onAuthStateChanged(auth,u=>{
  if(!u){window.location.href="index.html";return}
  const loginMs=new Date(u.metadata.lastSignInTime).getTime();
  if(Date.now()-loginMs>5*60*1000){
    signOut(auth).then(()=>{window.location.href="index.html";});
    return;
  }
  document.getElementById('tn').textContent=u.displayName||u.email;
  if(u.photoURL)document.getElementById('avi').src=u.photoURL;
  document.getElementById('ls').style.display='none';
  document.getElementById('tb').style.display='flex';
  document.getElementById('st').style.display='flex';
  document.getElementById('bb').style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>initFlip()));
});
window.doSO=async()=>{await signOut(auth);window.location.href="index.html"};
</script>
<script>
var pf         = null;
var keyHandler = null;
var resizeTimer= null;
var zoomLevel  = 1.0;
var ZOOM_STEP  = 0.15;
var ZOOM_MIN   = 0.5;
var ZOOM_MAX   = 2.0;

// ── ZOOM ──────────────────────────────────────────
function applyZoom(){
  document.getElementById('zoom-wrap').style.transform = 'scale(' + zoomLevel + ')';
  // Update zoom label
  var btn = document.querySelector('.zoom-btn:nth-child(3)');
  if(btn) btn.textContent = Math.round(zoomLevel*100) + '%';
}
window.zoomIn    = function(){ zoomLevel = Math.min(ZOOM_MAX, zoomLevel+ZOOM_STEP); applyZoom(); };
window.zoomOut   = function(){ zoomLevel = Math.max(ZOOM_MIN, zoomLevel-ZOOM_STEP); applyZoom(); };
window.zoomReset = function(){ zoomLevel = 1.0; applyZoom(); };

// Pinch-to-zoom on mobile
var lastDist = 0;
document.addEventListener('touchstart', function(e){
  if(e.touches.length===2){
    lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
document.addEventListener('touchmove', function(e){
  if(e.touches.length===2){
    var dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    var delta = dist - lastDist;
    if(Math.abs(delta) > 5){
      zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomLevel + delta*0.005));
      applyZoom();
      lastDist = dist;
    }
  }
},{passive:true});

// Mouse wheel zoom
document.getElementById('st') && document.getElementById('st').addEventListener('wheel', function(e){
  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
    zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomLevel - e.deltaY*0.001));
    applyZoom();
  }
},{passive:false});

// ── SIZE ──────────────────────────────────────────
function calcSize(){
  var s  = document.getElementById('st');
  var sw = s.clientWidth  || window.innerWidth;
  var sh = s.clientHeight || (window.innerHeight - 100);
  // Single page, A4 ratio, fit in stage
  var pH = Math.floor(sh * 0.88);
  var pW = Math.floor(pH / 1.414);
  if(pW > sw * 0.88){ pW = Math.floor(sw * 0.88); pH = Math.floor(pW * 1.414); }
  return { w: pW, h: pH };
}

// ── INIT ──────────────────────────────────────────
function initFlip(){
  var sz = calcSize();
  var w  = sz.w, h = sz.h;

  if(keyHandler) document.removeEventListener('keydown', keyHandler);

  // Remove old PageFlip DOM
  if(pf){
    var old = document.querySelector('.stf__parent');
    if(old && old.parentNode) old.parentNode.removeChild(old);
    pf = null;
  }

  // ── HARDCODED pages — most reliable approach ──
  // Dynamic detection via HEAD/img.onerror is unreliable on GitHub Pages
  // To add more CV pages: add page-2.jpg, page-3.jpg etc AND update this array
  var PAGES = [
    'pages/page-cover.jpg',
    'pages/page-1.jpg',
    'pages/page-back.jpg'
  ];

  // Preload all images BEFORE initializing PageFlip
  var loaded = 0;
  var total  = PAGES.length;

  PAGES.forEach(function(src){
    var img = new Image();
    img.onload = img.onerror = function(){
      loaded++;
      if(loaded === total) startPageFlip(PAGES, w, h);
    };
    img.src = src;
  });
}

function startPageFlip(pages, w, h){
  pf = new St.PageFlip(document.getElementById('flipbook'), {
    width:               w,
    height:              h,
    size:                'fixed',
    showCover:           false,
    drawShadow:          true,
    maxShadowOpacity:    0.8,
    flippingTime:        800,
    usePortrait:         true,
    startZIndex:         0,
    autoSize:            false,
    useMouseEvents:      true,
    mobileScrollSupport: false,
    swipeDistance:       5,
    showPageCorners:     true,
    disableFlipByClick:  false,
    clickEventForward:   false,
  });

  pf.loadFromImages(pages);

  pf.on('flip', function(e){ updateNav(e.data, pages.length); });
  pf.on('init', function(){  updateNav(0, pages.length); });

  keyHandler = function(e){
    if(e.key==='ArrowRight') pf.flipNext();
    if(e.key==='ArrowLeft')  pf.flipPrev();
  };
  document.addEventListener('keydown', keyHandler);
}

function updateNav(idx, total){
  document.getElementById('bp').disabled = (idx <= 0);
  document.getElementById('bn').disabled = (idx >= total - 1);
}

window.doNext = function(){ if(pf) pf.flipNext(); };
window.doPrev = function(){ if(pf) pf.flipPrev(); };

window.onresize = function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(initFlip, 300);
};
</script>
</body>
</html>
