<style>

        * { margin:0; padding:0; box-sizing:border-box; }
        body {

<script>
// ═══════════════════════════════════════════════════════════
//  PAGE CURL ENGINE
//  - Pojok kertas mengikuti mouse (hover effect)
//  - Drag untuk flip penuh
//  - Click pojok untuk flip otomatis
// ═══════════════════════════════════════════════════════════

let PW, PH;
let isOpen = false;
let isAnimating = false;

// Curl state
let curlActive = false;   // mouse hovering corner
let curlX = 0, curlY = 0; // current curl position (from bottom-right)
let targetCurlX = 0, targetCurlY = 0;
let curlRaf = null;

// Drag state
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragProgress = 0;

// Images
const imgCover = new Image();
const imgCV    = new Image();
let canvas, ctx;

// ── INIT ──────────────────────────────────────────────────
function init() {
    const stage = document.getElementById('stage');
    const sw = stage.clientWidth, sh = stage.clientHeight;
    let pH = Math.min(sh*0.88, 580);
    let pW = Math.min(pH/1.414, (sw*0.88)/2);
    pH = Math.floor(pW*1.414); pW = Math.floor(pW);
    PW = pW; PH = pH;

    ['leftHalf','rightHalf'].forEach(id=>{
        const el=document.getElementById(id);
        el.style.width=PW+'px'; el.style.height=PH+'px';
    });
    document.getElementById('spine').style.height=PH+'px';

    canvas = document.getElementById('flipCanvas');
    canvas.width=PW; canvas.height=PH;
    canvas.style.width=PW+'px'; canvas.style.height=PH+'px';
    ctx = canvas.getContext('2d');

    imgCV.src    = 'pages/page-1.jpg';
    imgCover.src = '../FotoProfil.jpeg';

    renderStatic();
    setupEvents();

    document.addEventListener('keydown', e=>{
        if(e.key==='ArrowRight'&&!isOpen) triggerFlip(true);
        if(e.key==='ArrowLeft'&&isOpen)   triggerFlip(false);
    });
    window.addEventListener('resize', ()=>{ init(); });
}

// ── STATIC RENDER ─────────────────────────────────────────
function renderStatic() {
    const lc = document.getElementById('leftContent');
    const rc = document.getElementById('rightContent');
    lc.style.cssText = `width:${PW}px;height:${PH}px;`;
    rc.style.cssText = `width:${PW}px;height:${PH}px;`;

    if (!isOpen) {
        lc.innerHTML = `<div class="p-blank" style="width:${PW}px;height:${PH}px;">
            <div class="blank-inner"><div style="font-size:22px;margin-bottom:8px;">✦</div><div>Mochammad Maulana Ibrahim</div></div></div>`;
        rc.innerHTML = `<div class="p-cover" style="width:${PW}px;height:${PH}px;">
            <div class="cover-grid"></div>
            <div class="cover-inner">
                <div class="cover-eyebrow">Curriculum Vitae · 2026</div>
                <div class="cover-photo"><img src="../FotoProfil.jpeg" alt="MMI" onerror="this.style.display='none';this.parentElement.innerHTML='MMI';"></div>
                <div class="cover-name">Mochammad<br>Maulana Ibrahim</div>
                <div class="cover-rule"></div>
                <div class="cover-quote">"The most overlooked data,<br>when gathered with patience,<br>becomes the clearest insight."</div>
                <div class="cover-cta">← Drag corner to open</div>
            </div></div>`;
    } else {
        lc.innerHTML = `<div class="p-cv" style="width:${PW}px;height:${PH}px;"><img src="pages/page-1.jpg" alt="CV"></div>`;
        rc.innerHTML = `<div class="p-back" style="width:${PW}px;height:${PH}px;">
            <div class="bc-content">
                <div class="bc-title">Get In Touch</div>
                <div class="bc-quote">"I turn ignored data into<br>meaningful insights<br>that transform systems."</div>
                <div class="bc-contacts">
                    <div class="bc-item"><span class="bc-icon">✉</span><span>mochammad.maulana.i.01@gmail.com</span></div>
                    <div class="bc-item"><span class="bc-icon">📱</span><span>(+62) 898-9210-565</span></div>
                    <div class="bc-item"><span class="bc-icon">🔗</span><span>linkedin.com/in/mmi01</span></div>
                    <div class="bc-item"><span class="bc-icon">🌐</span><span>mmaulana2405.github.io</span></div>
                </div>
            </div></div>`;
    }
    canvas.style.display='none';
    ctx.clearRect(0,0,PW,PH);
}

// ── EVENTS ────────────────────────────────────────────────
function getPos(e) {
    const rect = document.getElementById('rightHalf').getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY) - rect.top;
    return { x:cx, y:cy };
}

function inCornerZone(x, y, size=120) {
    return x > PW-size && y > PH-size;
}

function setupEvents() {
    const rh = document.getElementById('rightHalf');

    // ── MOUSE MOVE: curl effect ──
    rh.addEventListener('mousemove', e=>{
        if(isAnimating||isDragging) return;
        const {x,y} = getPos(e);
        if(inCornerZone(x,y)) {
            curlActive = true;
            // How deep into corner (0=edge, 1=deep)
            const dx = (PW-x)/120;
            const dy = (PH-y)/120;
            const depth = Math.min(1, Math.sqrt(dx*dx+dy*dy));
            targetCurlX = PW - x;
            targetCurlY = PH - y;
            rh.style.cursor='pointer';
            startCurlAnim();
        } else {
            if(curlActive) {
                curlActive=false;
                targetCurlX=0; targetCurlY=0;
                rh.style.cursor='default';
                startCurlAnim();
            }
        }
    });

    rh.addEventListener('mouseleave', ()=>{
        curlActive=false;
        targetCurlX=0; targetCurlY=0;
        rh.style.cursor='default';
        startCurlAnim();
    });

    // ── MOUSE DOWN: start drag ──
    rh.addEventListener('mousedown', e=>{
        if(isAnimating) return;
        if(e.target.closest&&e.target.closest('.bc-content')) return;
        isDragging=true;
        dragStartX=e.clientX; dragStartY=e.clientY;
        dragProgress=0;
        e.preventDefault();
    });

    

    document.addEventListener('mouseup', e=>{
        if(!isDragging) return;
        isDragging=false;
        const snap = dragProgress>0.35;
        if(!isOpen) snap ? animateFlip(dragProgress,1,true) : animateFlip(dragProgress,0,false);
        else        snap ? animateFlip(dragProgress,0,false) : animateFlip(dragProgress,1,true);
    });

    // ── TOUCH ──
    rh.addEventListener('touchstart', e=>{
        if(isAnimating) return;
        isDragging=true;
        dragStartX=e.touches[0].clientX;
        dragProgress=0;
    },{passive:true});

    document.addEventListener('touchmove', e=>{
        if(!isDragging||isAnimating) return;
        const dx=e.touches[0].clientX-dragStartX;
        dragProgress = isOpen
            ? Math.max(0,Math.min(1,1+dx/PW))
            : Math.max(0,Math.min(1,-dx/PW));
        renderFlipDirectional(dragProgress, !isOpen);
    },{passive:true});

    document.addEventListener('touchend', ()=>{
        if(!isDragging) return;
        isDragging=false;
        const snap=dragProgress>0.35;
        if(!isOpen) snap?animateFlip(dragProgress,1,true):animateFlip(dragProgress,0,false);
        else        snap?animateFlip(dragProgress,0,false):animateFlip(dragProgress,1,true);
    });

    // Click corner to flip
    rh.addEventListener('click', e=>{
        if(isAnimating||isDragging) return;
        const {x,y}=getPos(e);
        if(inCornerZone(x,y,120)) triggerFlip(!isOpen);
    });
}

// ── CURL ANIMATION (hover effect) ─────────────────────────
function startCurlAnim() {
    if(curlRaf) return;
    curlRaf = requestAnimationFrame(animateCurl);
}

function animateCurl() {
    const speed = 0.18;
    curlX += (targetCurlX-curlX)*speed;
    curlY += (targetCurlY-curlY)*speed;

    const moving = Math.abs(curlX-targetCurlX)>0.5 || Math.abs(curlY-targetCurlY)>0.5;

    if(curlX>1||curlY>1) {
        drawCurl(curlX, curlY);
    } else {
        canvas.style.display='none';
        ctx.clearRect(0,0,PW,PH);
    }

    if(moving) {
        curlRaf = requestAnimationFrame(animateCurl);
    } else {
        curlRaf=null;
        if(curlX<=1&&curlY<=1) {
            canvas.style.display='none';
            ctx.clearRect(0,0,PW,PH);
        }
    }
}

// ── DRAW CURL (corner peel effect) ────────────────────────
function drawCurl(cx, cy) {
    // cx, cy = how much the corner is peeled (pixels from bottom-right)
    canvas.style.display='block';
    ctx.clearRect(0,0,PW,PH);

    const maxPeel = Math.max(cx,cy);
    if(maxPeel<2) return;

    // Corner peel triangle
    const px = PW-cx;
    const py = PH-cy;

    // Draw the peeled-back triangle (showing back = CV image)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(PW, PH);       // bottom-right corner
    ctx.lineTo(px, PH);       // left edge of peel
    ctx.lineTo(PW, py);       // top edge of peel
    ctx.closePath();
    ctx.clip();

    // Back of page = CV image
    if(imgCV.complete&&imgCV.naturalWidth>0) {
        ctx.drawImage(imgCV, 0, 0, PW, PH);
    } else {
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,PW,PH);
    }

    // Gradient shadow on back
    const grad = ctx.createLinearGradient(px,py,PW,PH);
    grad.addColorStop(0,'rgba(0,0,0,0.3)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,PW,PH);

    ctx.restore();

    // Shadow under the peel
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(px, PH);
    ctx.lineTo(PW, py);
    ctx.lineTo(PW, PH);
    ctx.closePath();

    const shadowGrad = ctx.createLinearGradient(px,py,PW,PH);
    shadowGrad.addColorStop(0,'rgba(0,0,0,0.25)');
    shadowGrad.addColorStop(0.5,'rgba(0,0,0,0.1)');
    shadowGrad.addColorStop(1,'rgba(0,0,0,0)');

    // Draw shadow slightly offset
    ctx.translate(-3,3);
    ctx.fillStyle=shadowGrad;
    ctx.fill();
    ctx.restore();

    // Fold line
    ctx.beginPath();
    ctx.moveTo(px, PH);
    ctx.lineTo(PW, py);
    ctx.strokeStyle='rgba(0,0,0,0.2)';
    ctx.lineWidth=1;
    ctx.stroke();
}

// ── FLIP ANIMATION ────────────────────────────────────────
function renderFlip(prog) {
    if(prog<=0) { canvas.style.display='none'; return; }
    if(prog>=1) { canvas.style.display='none'; return; }

    canvas.style.display='block';
    ctx.clearRect(0,0,PW,PH);

    const foldX = PW*(1-prog);

    // Left of fold: back of page (CV)
    if(foldX>0) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0,0,foldX,PH); ctx.clip();
        if(imgCV.complete&&imgCV.naturalWidth>0) ctx.drawImage(imgCV,0,0,PW,PH);
        else { ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH); }
        const sg=ctx.createLinearGradient(foldX-60,0,foldX,0);
        sg.addColorStop(0,'rgba(0,0,0,0)');
        sg.addColorStop(1,`rgba(0,0,0,${0.4*prog})`);
        ctx.fillStyle=sg; ctx.fillRect(foldX-60,0,60,PH);
        ctx.restore();
    }

    // Right of fold: front (cover, compressed)
    if(foldX<PW) {
        const scaleX=Math.abs(Math.cos(prog*Math.PI));
        if(scaleX>0.01) {
            ctx.save();
            ctx.beginPath(); ctx.rect(foldX,0,PW-foldX,PH); ctx.clip();
            ctx.translate(foldX,0); ctx.scale(scaleX,1);
            drawCoverCanvas(0,0,PW,PH);
            ctx.scale(1/scaleX,1); ctx.translate(-foldX,0);
            const fg=ctx.createLinearGradient(foldX,0,foldX+70,0);
            fg.addColorStop(0,`rgba(0,0,0,${0.5*(1-scaleX)})`);
            fg.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=fg; ctx.fillRect(foldX,0,70,PH);
            ctx.restore();
        }
    }

    // Fold line
    ctx.beginPath(); ctx.moveTo(foldX,0); ctx.lineTo(foldX,PH);
    ctx.strokeStyle=`rgba(0,0,0,${0.3*Math.sin(prog*Math.PI)})`;
    ctx.lineWidth=1.5; ctx.stroke();
}

function drawCoverCanvas(x,y,w,h) {
    const bg=ctx.createLinearGradient(x,y,x+w,y+h);
    bg.addColorStop(0,'#0A1628'); bg.addColorStop(0.45,'#0D1F3C'); bg.addColorStop(1,'#080D1A');
    ctx.fillStyle=bg; ctx.fillRect(x,y,w,h);
    const gl=ctx.createRadialGradient(x+w*0.4,y+h*0.35,0,x+w*0.4,y+h*0.35,w*0.6);
    gl.addColorStop(0,'rgba(0,100,220,0.3)'); gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gl; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(0,212,255,0.05)'; ctx.lineWidth=1;
    for(let gx=x;gx<x+w;gx+=36){ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+h);ctx.stroke();}
    for(let gy=y;gy<y+h;gy+=36){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);ctx.stroke();}
    const cx2=x+w/2,cy2=y+h*0.32,r=Math.min(w,h)*0.1;
    ctx.save(); ctx.beginPath(); ctx.arc(cx2,cy2,r,0,Math.PI*2); ctx.clip();
    if(imgCover.complete&&imgCover.naturalWidth>0) ctx.drawImage(imgCover,cx2-r,cy2-r,r*2,r*2);
    else { const pg=ctx.createLinearGradient(cx2-r,cy2-r,cx2+r,cy2+r); pg.addColorStop(0,'#0050B8'); pg.addColorStop(1,'#00D4FF'); ctx.fillStyle=pg; ctx.fillRect(cx2-r,cy2-r,r*2,r*2); }
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font=`bold ${Math.floor(w*0.065)}px serif`;
    ctx.fillText('Mochammad',cx2,cy2+r+h*0.08);
    ctx.fillText('Maulana Ibrahim',cx2,cy2+r+h*0.145);
    ctx.strokeStyle='rgba(0,212,255,0.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx2-20,cy2+r+h*0.175); ctx.lineTo(cx2+20,cy2+r+h*0.175); ctx.stroke();
}

function animateFlip(from, to, openState) {
    if(isAnimating) return;
    isAnimating=true;
    const diff=to-from, dur=650, t0=performance.now();

    // Determine what to show during animation
    // Opening (openState=true): front=cover, back=CV
    // Closing (openState=false): front=CV, back=cover
    const animatingOpen = openState;

    function step(now) {
        const t=Math.min((now-t0)/dur,1);
        const ease=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        const prog=from+diff*ease;
        renderFlipDirectional(prog, animatingOpen);
        if(t<1) requestAnimationFrame(step);
        else {
            isAnimating=false; isOpen=openState;
            renderStatic(); updateUI();
        }
    }
    requestAnimationFrame(step);
}

function renderFlipDirectional(prog, opening) {
    if(prog<=0) { canvas.style.display='none'; return; }
    if(prog>=1) { canvas.style.display='none'; return; }

    canvas.style.display='block';
    ctx.clearRect(0,0,PW,PH);

    const foldX = PW*(1-prog);

    // Left of fold: back of flipping page
    if(foldX>0) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0,0,foldX,PH); ctx.clip();
        if(opening) {
            // Opening: back = CV image
            if(imgCV.complete&&imgCV.naturalWidth>0) ctx.drawImage(imgCV,0,0,PW,PH);
            else { ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH); }
        } else {
            // Closing: back = cover
            drawCoverCanvas(0,0,PW,PH);
        }
        const sg=ctx.createLinearGradient(foldX-60,0,foldX,0);
        sg.addColorStop(0,'rgba(0,0,0,0)');
        sg.addColorStop(1,`rgba(0,0,0,${0.4*prog})`);
        ctx.fillStyle=sg; ctx.fillRect(foldX-60,0,60,PH);
        ctx.restore();
    }

    // Right of fold: front of flipping page (compressed)
    if(foldX<PW) {
        const scaleX=Math.abs(Math.cos(prog*Math.PI));
        if(scaleX>0.01) {
            ctx.save();
            ctx.beginPath(); ctx.rect(foldX,0,PW-foldX,PH); ctx.clip();
            ctx.translate(foldX,0); ctx.scale(scaleX,1);
            if(opening) {
                // Opening: front = cover
                drawCoverCanvas(0,0,PW,PH);
            } else {
                // Closing: front = CV
                if(imgCV.complete&&imgCV.naturalWidth>0) ctx.drawImage(imgCV,0,0,PW,PH);
                else { ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH); }
            }
            ctx.scale(1/scaleX,1); ctx.translate(-foldX,0);
            const fg=ctx.createLinearGradient(foldX,0,foldX+70,0);
            fg.addColorStop(0,`rgba(0,0,0,${0.5*(1-scaleX)})`);
            fg.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=fg; ctx.fillRect(foldX,0,70,PH);
            ctx.restore();
        }
    }

    // Fold line
    ctx.beginPath(); ctx.moveTo(foldX,0); ctx.lineTo(foldX,PH);
    ctx.strokeStyle=`rgba(0,0,0,${0.3*Math.sin(prog*Math.PI)})`;
    ctx.lineWidth=1.5; ctx.stroke();
}

window.triggerFlip = (toOpen) => {
    if(isAnimating) return;
    if(toOpen && !isOpen) {
        // Open: animate cover flipping left (prog 0→1)
        animateFlip(0, 1, true);
    } else if(!toOpen && isOpen) {
        // Close: animate CV flipping back right (prog 0→1, but openState=false)
        // We need to show cover on right, CV on left during close animation
        // Swap content first, then animate
        isOpen = false;
        renderStatic(); // now shows cover on right
        // Animate from fully open (prog=1) back to closed (prog=0)
        // But renderStatic already shows closed state, so we animate the "close" flip
        isOpen = true; // temporarily set back so renderFlip draws correctly
        animateFlip(1, 0, false);
    }
};

function updateUI() {
    document.getElementById('btnPrev').disabled=!isOpen;
    document.getElementById('btnNext').disabled=isOpen;
    document.getElementById('pageLabel').textContent=isOpen?'CV':'Cover';
}
</script>
