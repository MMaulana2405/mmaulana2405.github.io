<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CV — Mochammad Maulana Ibrahim</title>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #050810;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── TOP BAR ── */
        .topbar {
            height: 50px; flex-shrink: 0;
            background: rgba(8,13,26,0.98);
            border-bottom: 1px solid rgba(0,212,255,0.12);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #0050B8, #00D4FF);
            overflow: hidden; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700;
        }
        .topbar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .topbar-name  { font-size: 13px; font-weight: 600; }
        .topbar-label { font-size: 10px; color: #00D4FF; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .btn-download {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: 20px; color: #00D4FF;
            font-size: 11px; font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer; text-decoration: none;
            transition: all 0.2s;
        }
        .btn-download:hover { background: rgba(0,212,255,0.18); }
        .btn-signout {
            font-size: 11px; color: rgba(255,255,255,0.25);
            background: none; border: none;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: color 0.2s;
        }
        .btn-signout:hover { color: #00D4FF; }

        /* ── STAGE ── */
        .stage {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 25% 40%, rgba(0,60,160,0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 65%, rgba(0,212,255,0.07) 0%, transparent 50%),
                #050810;
            position: relative; overflow: hidden;
            perspective: 4000px;
        }
        .stage::before {
            content: '';
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* ── BOOK ── */
        #book {
            position: relative;
            display: flex;
            transform-style: preserve-3d;
            filter: drop-shadow(0 40px 80px rgba(0,0,0,0.8));
        }

        /* ── PAGES ── */
        .book-page {
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Spine shadow */
        #spine {
            width: 8px;
            flex-shrink: 0;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(0,212,255,0.15) 10%,
                rgba(0,212,255,0.35) 50%,
                rgba(0,212,255,0.15) 90%,
                transparent 100%);
            z-index: 20;
            align-self: stretch;
        }

        /* ── FLIP CONTAINER ── */
        #flipContainer {
            position: absolute;
            top: 0; right: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            cursor: grab;
            z-index: 10;
        }
        #flipContainer.grabbing { cursor: grabbing; }

        .flip-front, .flip-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }
        .flip-back {
            transform: rotateY(180deg);
        }

        /* Shadow overlay on flip */
        #flipShadow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.1s;
        }

        /* ── COVER PAGE ── */
        .cover-page {
            width: 100%; height: 100%;
            background: linear-gradient(145deg, #0A1628 0%, #0D1F3C 45%, #080D1A 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 36px 28px; text-align: center;
            position: relative;
        }
        .cover-page::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 40% 35%, rgba(0,100,220,0.32) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 75%, rgba(0,212,255,0.12) 0%, transparent 45%);
            pointer-events: none;
        }
        .cover-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
        }
        .cover-inner { position: relative; z-index: 1; }
        .cover-eyebrow {
            font-size: 9px; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase;
            color: #00D4FF; margin-bottom: 20px; opacity: 0.85;
        }
        .cover-photo {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #0050B8, #00D4FF);
            margin: 0 auto 18px;
            box-shadow: 0 0 32px rgba(0,212,255,0.3);
            overflow: hidden;
        }
        .cover-photo img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center top;
        }
        .cover-name {
            font-family: 'Playfair Display', serif;
            font-size: 22px; font-weight: 700;
            color: #fff; line-height: 1.25; margin-bottom: 12px;
        }
        .cover-rule {
            width: 36px; height: 1px;
            background: rgba(0,212,255,0.5);
            margin: 0 auto 14px;
        }
        .cover-quote {
            font-size: 11px; color: rgba(255,255,255,0.6);
            line-height: 1.75; font-style: italic;
            max-width: 210px; margin: 0 auto 22px;
        }
        .cover-cta {
            font-size: 10px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: #00D4FF;
            border: 1px solid rgba(0,212,255,0.35);
            padding: 7px 16px; border-radius: 20px;
            background: rgba(0,212,255,0.07);
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Blank page */
        .blank-page {
            width: 100%; height: 100%;
            background: #0A1220;
            display: flex; align-items: center; justify-content: center;
        }
        .blank-inner {
            text-align: center; opacity: 0.15;
            font-size: 11px; color: rgba(255,255,255,0.6);
        }

        /* CV page */
        .cv-page {
            width: 100%; height: 100%;
            background: #fff;
        }
        .cv-page img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: top center;
            display: block;
        }

        /* Back cover */
        .backcover-page {
            width: 100%; height: 100%;
            background: linear-gradient(145deg, #080D1A, #0D1A35);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 36px 28px; text-align: center;
            position: relative;
        }
        .backcover-page::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(0,80,180,0.18) 0%, transparent 65%);
            pointer-events: none;
        }
        .bc-content {
            position: relative; z-index: 1;
            user-select: text;
            -webkit-user-select: text;
        }
        .bc-title {
            font-size: 10px; letter-spacing: 2.5px;
            text-transform: uppercase; color: #00D4FF;
            margin-bottom: 18px; user-select: none;
        }
        .bc-quote {
            font-family: 'Playfair Display', serif;
            font-size: 13px; font-style: italic;
            color: rgba(255,255,255,0.65); line-height: 1.85;
            margin-bottom: 28px;
        }
        .bc-contacts { display: flex; flex-direction: column; gap: 10px; }
        .bc-item {
            font-size: 11px; color: rgba(255,255,255,0.7);
            display: flex; align-items: center;
            justify-content: center; gap: 8px;
        }
        .bc-icon { color: #00D4FF; user-select: none; }

        /* Corner hint */
        .corner-hint {
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,212,255,0.15) 50%);
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s;
        }
        .corner-hint:hover {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,212,255,0.25) 50%);
        }

        /* ── BOTTOM BAR ── */
        .bottombar {
            height: 50px; flex-shrink: 0;
            background: rgba(8,13,26,0.98);
            border-top: 1px solid rgba(0,212,255,0.1);
            display: flex; align-items: center;
            justify-content: center; gap: 16px;
            backdrop-filter: blur(12px);
        }
        .nav-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 18px;
            background: rgba(0,212,255,0.08);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px; color: #00D4FF;
            font-size: 12px; font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(0,212,255,0.16);
            transform: translateY(-1px);
        }
        .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .page-label {
            font-size: 11px; color: rgba(255,255,255,0.25);
            min-width: 80px; text-align: center;
        }

        /* ── LOADING ── */
        .loading-screen {
            position: fixed; inset: 0;
            background: #080D1A;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            z-index: 200;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 2px solid rgba(0,212,255,0.15);
            border-top-color: #00D4FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 12px; color: rgba(255,255,255,0.6); }
    </style>

<script>
// ══════════════════════════════════════════════
//  REALISTIC PAGE FLIP ENGINE
//  Mouse-following curl with canvas shadow
// ══════════════════════════════════════════════

let PW, PH; // page width, height
let isOpen = false;
let isAnimating = false;
let isDragging = false;
let dragStartX = 0;
let currentAngle = 0; // 0 = cover, 180 = open

// Preload images for canvas rendering
const coverImg  = new Image();
const cvImg     = new Image();
const blankImg  = new Image();

// Canvas for flip effect
let canvas, ctx;

function initBook() {
    const stage = document.getElementById('stage');
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;

    let pH = Math.min(sh * 0.88, 600);
    let pW = Math.min(pH / 1.414, (sw * 0.88) / 2);
    pH = pW * 1.414;
    PW = Math.floor(pW);
    PH = Math.floor(pH);

    // Size pages
    document.getElementById('leftPage').style.width  = PW + 'px';
    document.getElementById('leftPage').style.height = PH + 'px';
    document.getElementById('rightPage').style.width  = PW + 'px';
    document.getElementById('rightPage').style.height = PH + 'px';
    document.getElementById('rightContent').style.width  = PW + 'px';
    document.getElementById('rightContent').style.height = PH + 'px';
    document.getElementById('coverContent').style.width  = PW + 'px';
    document.getElementById('coverContent').style.height = PH + 'px';
    document.getElementById('spine').style.height = PH + 'px';

    // Setup flip container & canvas
    const fc = document.getElementById('flipContainer');
    fc.style.width  = PW + 'px';
    fc.style.height = PH + 'px';
    fc.style.top    = '0';
    fc.style.right  = '0';
    fc.style.left   = 'auto';
    fc.style.position = 'absolute';

    canvas = document.getElementById('flipCanvas');
    canvas.width  = PW;
    canvas.height = PH;
    canvas.style.width  = PW + 'px';
    canvas.style.height = PH + 'px';
    canvas.style.position = 'absolute';
    canvas.style.top  = '0';
    canvas.style.left = '0';
    ctx = canvas.getContext('2d');

    // Load images
    cvImg.src = 'pages/page-1.jpg';
    coverImg.src = '../FotoProfil.jpeg';

    // Setup drag on right page
    setupDrag();

    // Keyboard
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && !isOpen) flipToOpen();
        if (e.key === 'ArrowLeft'  && isOpen)  flipToClose();
    });

    window.addEventListener('resize', () => {
        initBook();
    });

    // Initial render
    renderFlip(0);
}

// ── DRAG SETUP ──
function setupDrag() {
    const rightPage = document.getElementById('rightPage');

    rightPage.addEventListener('mousedown', onDragStart);
    rightPage.addEventListener('touchstart', onDragStart, { passive: true });
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('touchmove', onDragMove, { passive: true });
    window.addEventListener('mouseup', onDragEnd);
    window.addEventListener('touchend', onDragEnd);
}

function getClientX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
}

function onDragStart(e) {
    // Don't drag if clicking on selectable text (back cover)
    if (isOpen && e.target.closest('.bc-content')) return;
    isDragging = true;
    dragStartX = getClientX(e);
    document.getElementById('flipContainer').classList.add('grabbing');
}

function onDragMove(e) {
    if (!isDragging) return;
    const x = getClientX(e);
    const dx = x - dragStartX;
    const rightPage = document.getElementById('rightPage');
    const rect = rightPage.getBoundingClientRect();

    // Calculate angle based on drag
    let angle;
    if (!isOpen) {
        // Dragging left to open: 0 → 180
        angle = Math.max(0, Math.min(180, (-dx / PW) * 180));
    } else {
        // Dragging right to close: 180 → 0
        angle = Math.max(0, Math.min(180, 180 + (dx / PW) * 180));
    }

    currentAngle = angle;
    renderFlip(angle);
}

function onDragEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    document.getElementById('flipContainer').classList.remove('grabbing');

    // Snap based on current angle
    if (!isOpen) {
        if (currentAngle > 60) animateFlip(currentAngle, 180, true);
        else animateFlip(currentAngle, 0, false);
    } else {
        if (currentAngle < 120) animateFlip(currentAngle, 0, false);
        else animateFlip(currentAngle, 180, true);
    }
}

// ── ANIMATE FLIP ──
function animateFlip(fromAngle, toAngle, openState) {
    if (isAnimating) return;
    isAnimating = true;

    const duration = 600;
    const start = performance.now();
    const diff = toAngle - fromAngle;

    function step(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        // Ease in-out cubic
        const ease = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        const angle = fromAngle + diff * ease;
        currentAngle = angle;
        renderFlip(angle);

        if (progress < 1) {
            requestAnimationFrame(step);
        } else {
            isAnimating = false;
            isOpen = openState;
            currentAngle = toAngle;
            renderFlip(toAngle);
            updateUI();
            updatePageContent();
        }
    }
    requestAnimationFrame(step);
}

// ── RENDER FLIP ON CANVAS ──
function renderFlip(angle) {
    ctx.clearRect(0, 0, PW, PH);

    if (angle <= 0) {
        // Show cover (no flip)
        canvas.style.display = 'none';
        document.getElementById('rightContent').style.display = 'block';
        return;
    }

    if (angle >= 180) {
        // Fully open — show back cover
        canvas.style.display = 'none';
        document.getElementById('rightContent').style.display = 'block';
        return;
    }

    // Show canvas during flip
    canvas.style.display = 'block';
    document.getElementById('rightContent').style.display = 'none';

    // Normalized progress 0→1
    const t = angle / 180;

    // The fold x position (moves from right to left)
    const foldX = PW * (1 - t);

    // Draw the visible part of the page being flipped
    // Left part: back of page (CV image)
    if (foldX > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, foldX, PH);
        ctx.clip();

        // Draw CV image (back of cover page)
        if (cvImg.complete && cvImg.naturalWidth > 0) {
            ctx.drawImage(cvImg, 0, 0, PW, PH);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, PW, PH);
            ctx.fillStyle = '#333';
            ctx.font = '14px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('CV Loading...', PW/2, PH/2);
        }

        // Shadow on the left edge of fold
        const shadowW = Math.min(40, foldX);
        const grad = ctx.createLinearGradient(foldX - shadowW, 0, foldX, 0);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.35)');
        ctx.fillStyle = grad;
        ctx.fillRect(foldX - shadowW, 0, shadowW, PH);

        ctx.restore();
    }

    // Right part: front of page (cover) — compressed/squeezed
    if (foldX < PW) {
        const visibleW = PW - foldX;
        const scaleX = Math.cos(angle * Math.PI / 180);
        const absScale = Math.abs(scaleX);

        ctx.save();
        ctx.beginPath();
        ctx.rect(foldX, 0, visibleW, PH);
        ctx.clip();

        if (absScale > 0.01) {
            ctx.translate(foldX, 0);
            ctx.scale(absScale, 1);

            // Draw cover content
            drawCoverOnCanvas(ctx, PW, PH);

            ctx.scale(1/absScale, 1);
            ctx.translate(-foldX, 0);
        }

        // Shadow gradient on fold
        const foldShadowW = Math.min(60, visibleW);
        const foldGrad = ctx.createLinearGradient(foldX, 0, foldX + foldShadowW, 0);
        foldGrad.addColorStop(0, `rgba(0,0,0,${0.5 * (1 - absScale)})`);
        foldGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = foldGrad;
        ctx.fillRect(foldX, 0, foldShadowW, PH);

        ctx.restore();
    }

    // Fold line
    ctx.beginPath();
    ctx.moveTo(foldX, 0);
    ctx.lineTo(foldX, PH);
    ctx.strokeStyle = `rgba(0,0,0,${0.3 * Math.sin(angle * Math.PI / 180)})`;
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawCoverOnCanvas(ctx, w, h) {
    // Background
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0,   '#0A1628');
    grad.addColorStop(0.45,'#0D1F3C');
    grad.addColorStop(1,   '#080D1A');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = 'rgba(0,212,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 36) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
    for (let y = 0; y < h; y += 36) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }

    // Glow
    const glow = ctx.createRadialGradient(w*0.4, h*0.35, 0, w*0.4, h*0.35, w*0.6);
    glow.addColorStop(0, 'rgba(0,100,220,0.32)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // Photo circle
    const cx = w/2, cy = h * 0.32, r = Math.min(w,h) * 0.1;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.clip();
    if (coverImg.complete && coverImg.naturalWidth > 0) {
        ctx.drawImage(coverImg, cx-r, cy-r, r*2, r*2);
    } else {
        const pg = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
        pg.addColorStop(0, '#0050B8');
        pg.addColorStop(1, '#00D4FF');
        ctx.fillStyle = pg;
        ctx.fillRect(cx-r, cy-r, r*2, r*2);
    }
    ctx.restore();

    // Name text
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.floor(w*0.07)}px 'Playfair Display', serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Mochammad', cx, cy + r + h*0.08);
    ctx.fillText('Maulana Ibrahim', cx, cy + r + h*0.14);

    // Accent line
    ctx.strokeStyle = 'rgba(0,212,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 18, cy + r + h*0.17);
    ctx.lineTo(cx + 18, cy + r + h*0.17);
    ctx.stroke();
}
