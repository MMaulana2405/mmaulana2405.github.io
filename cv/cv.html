<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CV — Mochammad Maulana Ibrahim</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: #050810;
  color: #fff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  height: 50px;
  flex-shrink: 0;
  background: rgba(8,13,26,0.98);
  border-bottom: 1px solid rgba(0,212,255,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  backdrop-filter: blur(12px);
  z-index: 10;
}
.tbl { display: flex; align-items: center; gap: 10px; }
.av {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #0050B8, #00D4FF);
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
.av img { width: 100%; height: 100%; object-fit: cover; }
.tn { font-size: 13px; font-weight: 600; }
.tl { font-size: 10px; color: #00D4FF; }
.tbr { display: flex; align-items: center; gap: 12px; }
.bso {
  font-size: 11px; color: rgba(255,255,255,0.25);
  background: none; border: none; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.bso:hover { color: #00D4FF; }

/* PDF iframe fills remaining space */
#pdf-frame {
  flex: 1;
  width: 100%;
  border: none;
  display: none;
}

/* Loading */
.ls {
  position: fixed; inset: 0;
  background: #080D1A;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 200;
}
.sp {
  width: 32px; height: 32px;
  border: 2px solid rgba(0,212,255,0.15);
  border-top-color: #00D4FF;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.lt { font-size: 12px; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div class="ls" id="ls">
<div class="sp"></div>
<div class="lt">Verifying access...</div>
</div>
<div class="topbar" id="tb" style="display:none">
<div class="tbl">
<div class="av"><img alt="" id="avi" onerror="this.style.display='none'" src=""/></div>
<div>
<div class="tn" id="tn">—</div>
<div class="tl">Viewing CV · Access Recorded</div>
</div>
</div>
<div class="tbr">
<button class="bso" onclick="doSO()">Sign out</button>
</div>
</div>
<!-- Google Docs PDF Viewer — works on both mobile and desktop -->
<iframe allowfullscreen="" id="pdf-frame" title="CV Mochammad Maulana Ibrahim">
</iframe>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// PDF hosted on GitHub Pages — public URL
const PDF_URL = 'https://mmaulana2405.github.io/CV%20-%20Mochammad%20Maulana%20Ibrahim%20-%202026.pdf';

// Google Docs viewer embeds any public PDF — works on mobile & desktop
const VIEWER_URL = 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(PDF_URL);

const auth = getAuth(initializeApp({
  apiKey:            "AIzaSyBv4VrPdi1E7CByp79T6Ios4MGYpYRm9Uc",
  authDomain:        "personal-website-mmi.firebaseapp.com",
  projectId:         "personal-website-mmi",
  storageBucket:     "personal-website-mmi.firebasestorage.app",
  messagingSenderId: "57812235771",
  appId:             "1:57812235771:web:5cd823cee44e095fc1475e"
}));

onAuthStateChanged(auth, u => {
  if (!u) { window.location.href = "index.html"; return; }

  const loginMs = new Date(u.metadata.lastSignInTime).getTime();
  if (Date.now() - loginMs > 5 * 60 * 1000) {
    signOut(auth).then(() => { window.location.href = "index.html"; });
    return;
  }

  document.getElementById('tn').textContent = u.displayName || u.email;
  if (u.photoURL) document.getElementById('avi').src = u.photoURL;
  document.getElementById('ls').style.display = 'none';
  document.getElementById('tb').style.display = 'flex';

  // Load PDF via Google Docs viewer
  const frame = document.getElementById('pdf-frame');
  frame.src = VIEWER_URL;
  frame.style.display = 'block';
});

window.doSO = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};
</script>
</body>
</html>
